global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'xtr-aeroport-batch'
    # Path esposte da Spring Boot Actuator configurate sul MS Batch.
    metrics_path: '/xtr-aeroport-batch/actuator/prometheus'
    static_configs:
      # host.docker.internal funziona per Docker su Windows/Mac. In alternativa usa
      # l'host/IP dove e esposto il microservizio (non committare IP di rete reali).
      - targets: ['host.docker.internal:8081']

